services:
- type: web
  name: roys-cloak-tracker
  runtime: php
  repo: https://github.com/rulloa1/roys-cloak-tracker.git
  buildCommand: ""
  startCommand: "php -S 0.0.0.0:$PORT -t ."
  envVars:
  - key: PHP_VERSION
